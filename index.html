<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor Challenge | QR code component</title>

    <style>
      :root {
        --site-backgraound-color: hsl(212, 45%, 89%);
        --card-background-color: hsl(0, 0%, 100%);
        --header-color: hsl(218, 44%, 22%);
        --paragraph-color: hsl(216, 15%, 48%);
        --font-size: 15px;
        --font-weight-regular: 400;
        --font-weight-bold: 700;
        --font-family: "Outfit", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
        font-size: var(--font-size);
        font-weight: var(--font-weight-regular);
      }

      body {
        background-color: var(--site-backgraound-color);
      }

      main {
        width: 320px;
        height: 499px;
        background-color: var(--card-background-color);
        border-radius: 20px;
        padding: 16px;
        padding-bottom: 40px;
        filter: drop-shadow();

        position: absolute;
        top: 50%;
        left: 50%;
        translate: -50% -50%;

        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: 24px;

        .qr-image {
          width: 100%;
          height: fit-content;

          border-radius: 10px;
        }

        .card-info {
          text-align: center;
          padding: 0 16px;

          h1 {
            color: var(--header-color);
            font-size: 1.5rem;
            font-weight: var(--font-weight-bold);
            line-height: 1.2;
            margin-bottom: 16px;
            letter-spacing: -0.3px;
          }

          p {
            color: var(--paragraph-color);
            line-height: 1.4;
            font-size: 1rem;
            letter-spacing: 0.1px;
          }
        }
      }

      footer {
        font-size: 11px;
        text-align: center;
        position: absolute;
        bottom: 10px;
        left: 50%;
        translate: -50% -50%;
      }

      footer a {
        color: hsl(228, 45%, 44%);
        font-size: 11px;
        text-decoration: none;
      }

      #temp {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        object-fit: cover;
        opacity: 0.5;
        pointer-events: none;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- <img src="design/desktop-design.jpg" alt="The design" id="temp" /> -->
    <div class="container">
      <main>
        <img class="qr-image" src="./images/image-qr-code.png" alt="QR Code" />
        <div class="card-info">
          <h1>Improve your front-end skills by building projects</h1>
          <p>
            Scan the QR code to visit Frontend Mentor and take your coding
            skills to the next level
          </p>
        </div>
      </main>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >.<br />
        Coded by
        <a href="https://github.com/VangmanawKairung">Kairung Vangmanaw</a>.
      </footer>
    </div>
  </body>
</html>
